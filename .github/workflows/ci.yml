name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run source checks and tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Test published-package shape
        shell: bash
        run: |
          npm pack --dry-run
          npm pack --pack-destination "$RUNNER_TEMP"
          package_file=$(find "$RUNNER_TEMP" -maxdepth 1 -name "frillab-copc-tiles-validate-*.tgz" -print -quit)
          test -n "$package_file"
          consumer=$(mktemp -d)
          npm install --prefix "$consumer" --no-audit --no-fund "$package_file"
          "$consumer/node_modules/.bin/copc-tiles-validate" --help

  producer-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install pinned producer fixtures dependencies
        working-directory: integration/producer-fixtures
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate and validate producer fixtures
        working-directory: integration/producer-fixtures
        run: npm test
