name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run source checks and tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Test packed consumer contract
        run: npm run test:packed

  differential-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install pinned producer and official validator tools
        working-directory: integration/producer-fixtures
        run: npm ci --no-audit --no-fund
      - name: Generate fixtures and compare validator outcomes
        working-directory: integration/producer-fixtures
        env:
          CONFORMANCE_REPORT_PATH: ${{ runner.temp }}/conformance-summary.json
        run: npm run test:conformance
      - name: Upload differential conformance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-conformance-summary
          path: ${{ runner.temp }}/conformance-summary.json
          if-no-files-found: warn
